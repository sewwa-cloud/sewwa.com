name: Auto PR to main

# Opens a PR to main for any pushed branch that isn't main itself and has
# commits main doesn't have yet. Idempotent: further pushes to the same
# branch update the existing PR (GitHub does this natively), so this only
# creates a PR if none is open yet.
#
# Use conventional-commit PR titles (feat:, fix:, chore:, content:, …).
# Squash-merge uses the PR title as the commit on main, which Release Please
# reads when it builds CHANGELOG.md and the next tag.

on:
  push:
    branches-ignore:
      - main
      - 'release-please--**' # avoid double-PR'ing release-please's own branch

permissions:
  contents: read
  pull-requests: write

jobs:
  open-pr:
    name: 🔀 Open PR to main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create PR to main if needed
        env:
          # PAT so PR creation is not blocked by "Allow GitHub Actions to
          # create and approve pull requests" being disabled.
          GH_TOKEN: ${{ secrets.RELEASE_BOT_TOKEN }}
        run: |
          set -euo pipefail
          BRANCH="${GITHUB_REF#refs/heads/}"

          git fetch origin main --quiet
          if [ -z "$(git log origin/main..HEAD --oneline)" ]; then
            echo "No commits ahead of main yet, skipping."
            exit 0
          fi

          EXISTING="$(gh pr list --base main --head "$BRANCH" --state open --json number --jq '.[0].number // empty')"
          if [ -n "$EXISTING" ]; then
            echo "PR #$EXISTING already open for $BRANCH, nothing to do."
            exit 0
          fi

          gh pr create --base main --head "$BRANCH" --fill
